name: Native builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      nintendo_components_only:
        description: Verify private Nintendo installation without GPU tests or release packaging
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

# Pin the compiler so a new stable release does not silently invalidate every cache.
env:
  RUSTUP_TOOLCHAIN: "1.100.0"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate package and bundle versions
        id: version
        run: |
          python3 - <<'PY'
          import os, re, tomllib, plistlib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('Package version must be numeric major.minor.patch')
          if plistlib.loads(Path('packaging/Info.plist').read_bytes())['CFBundleShortVersionString'] != version:
              raise SystemExit('macOS bundle version must match Cargo.toml')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY

  check:
    needs: validate
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust components
        shell: bash
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy --target ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-check-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Nintendo helper protocol tests
        run: node --test scripts/nintendo-presence.test.cjs
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Tests
        if: ${{ !inputs.nintendo_components_only }}
        timeout-minutes: 20
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build the GPUI application
        run: cargo build --locked --target ${{ matrix.target }} --bin console-link
      - name: Native GPUI video smoke
        if: ${{ !inputs.nintendo_components_only }}
        timeout-minutes: 2
        shell: bash
        run: python scripts/smoke-native.py "target/${{ matrix.target }}/debug/console-link${{ runner.os == 'Windows' && '.exe' || '' }}"
      - name: Upload GPUI smoke diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gpui-smoke-diagnostics-${{ matrix.target }}
          path: ${{ runner.temp }}/console-link-gpui-smoke.log
          if-no-files-found: ignore
      - name: Verify private Nintendo component installation
        timeout-minutes: 8
        shell: bash
        env:
          RUNTIME_TEST_DIR: ${{ runner.temp }}/console-link-nintendo-check
        run: cargo run --locked --target ${{ matrix.target }} --bin console-link -- --install-nintendo-runtime "$RUNTIME_TEST_DIR"

  package:
    # Build release candidates alongside tests, never for every PR iteration.
    # Publication requires the entire source run to be successful.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !inputs.nintendo_components_only
    needs: validate
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      CONSOLE_LINK_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust compiler
        shell: bash
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-release-${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          bash scripts/package-macos.sh
          python scripts/smoke-native.py "dist/Console Link.app/Contents/MacOS/console-link"
          mkdir -p dist/release
          cp dist/console-link-macos-arm64.zip "dist/release/console-link-${CONSOLE_LINK_VERSION}-macos-arm64.zip"
      - name: Package Windows and verify installation
        if: runner.os == 'Windows'
        timeout-minutes: 25
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1 -SmokeTest
          python scripts/smoke-native.py dist/windows-portable/console-link.exe
          if ($LASTEXITCODE -ne 0) { throw 'Packaged native GPU smoke failed.' }
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Copy-Item "dist/console-link-$env:CONSOLE_LINK_VERSION-windows-x64.zip" dist/release/
          Copy-Item "dist/Console-Link-$env:CONSOLE_LINK_VERSION-Setup-x64.exe" dist/release/
      - name: Upload release candidates
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Show publication inputs
        shell: bash
        run: |
          echo 'Release candidate ready for ${{ matrix.target }}.' >> "$GITHUB_STEP_SUMMARY"
          echo 'After this entire run succeeds, use **Publish tested release** with:' >> "$GITHUB_STEP_SUMMARY"
          echo "- build_run_id: $GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- release_tag: v$CONSOLE_LINK_VERSION" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload packaging diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packaging-diagnostics-${{ matrix.target }}
          path: ${{ runner.temp }}/console-link-*.log
          if-no-files-found: ignore
