[package]
name = "console-link"
default-run = "console-link"
version = "0.6.1"
edition = "2024"
license = "MIT"
description = "A focused desktop companion for HDMI capture cards"

[features]
default = ["gpui-ui"]
gpui-ui = ["dep:gpui", "dep:unicode-segmentation", "dep:anyhow"]
legacy-ui = ["dep:eframe"]

[[bin]]
name = "console-link"
path = "src/main.rs"
required-features = ["gpui-ui"]

[[bin]]
name = "console-link-legacy"
path = "src/legacy.rs"
required-features = ["legacy-ui"]

[dependencies]
anyhow = { version = "1", optional = true }
gpui = { version = "=0.2.2", optional = true, default-features = false, features = ["font-kit", "runtime_shaders", "windows-manifest"] }
unicode-segmentation = { version = "1", optional = true }
eframe = { version = "0.33", optional = true, default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
cpal = "0.16"
png = "0.18"
crossbeam-channel = "0.5"
discord-rich-presence = "1.1"
oauth2 = { version = "5", default-features = false, features = ["reqwest", "reqwest-blocking", "native-tls", "timing-resistant-secret-traits"] }
keyring = { version = "3.6", features = ["apple-native", "windows-native"] }
webbrowser = "1"
url = "2"
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
unicode-normalization = "0.1"
sha2 = "0.10"
# Cargo.lock resolves gpu-allocator against windows 0.58 to match wgpu-hal.
wgpu = { version = "27", default-features = false, features = ["metal", "dx12", "wgsl", "std"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow", "NSScreen", "NSCursor", "NSGraphics", "NSApplication"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSError", "NSObject", "NSDictionary", "NSValue"] }
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVCaptureInput", "AVCaptureOutput", "AVCaptureSession", "AVCaptureVideoDataOutput", "AVMediaFormat", "objc2-core-media", "objc2-core-video", "dispatch2"] }
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-core-foundation = "0.3"
dispatch2 = "0.3"
block2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "0.62"
windows58 = { package = "windows", version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Direct3D12", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Security"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_Media_MediaFoundation", "Win32_Media_KernelStreaming", "Win32_System_Threading", "Win32_System_Variant", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Pipes", "Win32_Security", "Win32_Storage_FileSystem"] }

[dev-dependencies]
ab_glyph = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1", default-features = false }

[profile.dev.package.console-link]
opt-level = 2
