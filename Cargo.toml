[package]
name = "console-link"
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "A focused desktop companion for HDMI capture cards"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
cpal = "0.16"
png = "0.18"
crossbeam-channel = "0.5"
discord-rich-presence = "1.1"
oauth2 = { version = "5", default-features = false, features = ["reqwest", "reqwest-blocking", "native-tls", "timing-resistant-secret-traits"] }
keyring = { version = "3.6", features = ["apple-native", "windows-native"] }
webbrowser = "1"
url = "2"
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ocrs = { version = "0.14", default-features = false, features = ["onnx"] }
rten = { version = "0.28", default-features = false, features = ["onnx_format"] }
sha2 = "0.10"
unicode-normalization = "0.1"
# Cargo.lock resolves gpu-allocator against windows 0.58 to match wgpu-hal.
wgpu = { version = "27", default-features = false, features = ["metal", "dx12", "wgsl", "std"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow", "NSScreen"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSError", "NSObject", "NSDictionary", "NSValue"] }
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVCaptureInput", "AVCaptureOutput", "AVCaptureSession", "AVCaptureVideoDataOutput", "AVMediaFormat", "objc2-core-media", "objc2-core-video", "dispatch2"] }
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-core-foundation = "0.3"
dispatch2 = "0.3"
block2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_Media_MediaFoundation", "Win32_Media_KernelStreaming", "Win32_System_Threading", "Win32_System_Variant", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Pipes", "Win32_Security", "Win32_Storage_FileSystem"] }

[dev-dependencies]
ab_glyph = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1", default-features = false }
